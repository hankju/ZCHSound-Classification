name: Artifact audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile public entry points
        run: |
          python -m py_compile scripts/*.py code/*.py

      - name: Verify checksums and packaged evidence
        run: |
          python scripts/verify_integrity.py
          python scripts/audit_release.py
          python scripts/audit_fold_local_protocol.py

      - name: Validate the 35-task baseline map
        run: |
          test "$(python scripts/run_backbone_task.py --list | wc -l)" -eq 35
